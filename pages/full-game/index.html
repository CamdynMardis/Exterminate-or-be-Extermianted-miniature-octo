<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exterminate or Be Exterminated</title>
  <link rel="stylesheet" href="full-game.css">
</head>
<body>

  <main id="mainMenu" class="main-menu">
    <section class="menu-panel">

      <img
        class="title-art"
        src="assets/images/title-art.png"
        alt="Exterminate or Be Exterminated"
      >

      <label for="playerName">Player name</label>

      <input
        id="playerName"
        type="text"
        placeholder="Leave blank for guest"
      >

      <button id="startGameBtn">START GAME</button>
      <button id="leaderboardBtn">LEADERBOARD</button>

    </section>
  </main>

  <main id="gameScreen" class="game-screen hidden">

    <header class="stage-hud">
      <button id="mainMenuBtn" class="back-button">
        ← MAIN MENU
      </button>

      <h1 id="stageTitle">
        STAGE 1: UNDER THE KITCHEN SINK
      </h1>

      <div class="hud-stats">
        <span>
          SEARCHES:
          <b id="searches">4</b>
        </span>

        <span>
          PESTS FOUND:
          <b id="pestsFound">0</b> / 3
        </span>
      </div>
    </header>

    <section class="stage-scene">

      <button class="hotspot spray-bottle" data-bug="roach">
        <img
          src="assets/images/spray-bottle.png"
          alt="Spray bottle"
        >
        <span class="object-label">SPRAY BOTTLE</span>
      </button>

      <button class="hotspot sponge" data-bug="spider">
        <img
          src="assets/images/sponge.png"
          alt="Sponge"
        >
        <span class="object-label">SPONGE</span>
      </button>

      <button class="hotspot bucket" data-bug="">
        <img
          src="assets/images/bucket.png"
          alt="Bucket"
        >
        <span class="object-label">BUCKET</span>
      </button>

      <button class="hotspot trash-bag-box" data-bug="">
        <img
          src="assets/images/trash-bag.png"
          alt="Trash bag box"
        >
        <span class="object-label">TRASH BAG BOX</span>
      </button>

      <button class="hotspot soap" data-bug="centipede">
        <img
          src="assets/images/soap.png"
          alt="Soap"
        >
        <span class="object-label">SOAP</span>
      </button>

      <img
        class="pest-image pest-roach"
        data-pest-image="roach"
        src="assets/images/roach.png"
        alt="Cockroach"
      >

      <img
        class="pest-image pest-spider"
        data-pest-image="spider"
        src="assets/images/spider.png"
        alt="Spider"
      >

      <img
        class="pest-image pest-centipede"
        data-pest-image="centipede"
        src="assets/images/centipede.png"
        alt="Centipede"
      >

    </section>

    <footer class="stage-footer">
      <p id="gameMessage">
        Search the objects to find the pests.
      </p>

      <button id="tryAgainBtn">
        TRY AGAIN
      </button>
    </footer>

  </main>

  <div id="jumpscare" class="jumpscare hidden">
    <div class="jumpscare-card">
      <h2>THE PESTS GOT YOU!</h2>

      <div id="remainingPests" class="remaining-pests"></div>

      <p>You missed some of the pests.</p>

      <button id="jumpscareTryAgain">
        TRY AGAIN
      </button>
    </div>
  </div>

  <div id="winScreen" class="win-screen hidden">
    <div class="win-card">
      <div class="win-icon">✓</div>

      <h2>STAGE COMPLETE</h2>

      <p>You found all three pests!</p>
      <p id="winScore"></p>

      <button id="nextStageBtn">
        NEXT STAGE
      </button>
    </div>
  </div>

  <div id="leaderboardModal" class="modal hidden">
    <div class="modal-card">

      <button id="closeLeaderboard" class="close-button">
        ×
      </button>

      <h2>Leaderboard</h2>
      <p>Each pest found earns 10 points.</p>

      <ol id="leaderboardList"></ol>

    </div>
  </div>

  <script src="full-game.js"></script>
</body>
</html>
